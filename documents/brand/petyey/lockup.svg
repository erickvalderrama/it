<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <title>Petyey — icon and wordmark lockup</title>
  <rect width="1200" height="400" rx="48" fill="#FFFFFF"/>
  <g transform="translate(90 56) scale(0.56)">
    <rect width="512" height="512" rx="112" fill="#D7EC9E"/>
    <g fill="#2B5735">
      <ellipse cx="124" cy="196" rx="34" ry="44" transform="rotate(-28 124 196)"/>
      <ellipse cx="204" cy="132" rx="38" ry="50" transform="rotate(-10 204 132)"/>
      <ellipse cx="308" cy="132" rx="38" ry="50" transform="rotate(10 308 132)"/>
      <ellipse cx="388" cy="196" rx="34" ry="44" transform="rotate(28 388 196)"/>
      <ellipse cx="256" cy="330" rx="108" ry="88"/>
    </g>
    <!-- Smile: the "yei" -->
    <path d="M202 318 Q256 378 310 318" fill="none" stroke="#D7EC9E" stroke-width="18" stroke-linecap="round"/>
  </g>
  <g transform="translate(221 0)">
    <text x="199" y="270" font-family="'Nunito','Varela Round','Arial Rounded MT Bold','Segoe UI',sans-serif" font-weight="800" font-size="180"><tspan fill="#243329">pet</tspan><tspan fill="#2B5735">yey</tspan></text>
    <!-- Celebration paw after "yey" -->
