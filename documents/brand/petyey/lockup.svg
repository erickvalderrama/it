      <ellipse cx="0" cy="12" rx="24" ry="20"/>
      <circle cx="-26" cy="-14" r="9"/>
      <circle cx="-9" cy="-30" r="9.5"/>
      <circle cx="9" cy="-30" r="9.5"/>
      <circle cx="26" cy="-14" r="9"/>
