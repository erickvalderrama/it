<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Petmiu logo drafts</title>
<style>
  body { margin: 0; padding: 24px; background: #F5F8EE; color: #243329; font-family: 'Segoe UI', sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; max-width: 1100px; }
  figure { margin: 0; background: #fff; border-radius: 16px; padding: 16px; text-align: center; }
  img { width: 100%; max-height: 300px; object-fit: contain; }
  .row { display: flex; gap: 12px; justify-content: center; align-items: center; margin-top: 8px; }
  .row img { width: auto; height: 48px; }
  .row img.small { height: 24px; }
  figcaption { font-weight: 600; margin-top: 8px; }
</style>
</head>
<body>
<div class="grid">
  <figure><img src="1-paw-cat-ears.svg" alt=""><div class="row"><img src="1-paw-cat-ears.svg" alt=""><img class="small" src="1-paw-cat-ears.svg" alt=""></div><figcaption>1. Huella con orejas de gato</figcaption></figure>
  <figure><img src="2-wordmark-cat-dot.svg" alt=""><figcaption>2. La "i" con cara de gato</figcaption></figure>
  <figure><img src="3-dog-cat-heart.svg" alt=""><div class="row"><img src="3-dog-cat-heart.svg" alt=""><img class="small" src="3-dog-cat-heart.svg" alt=""></div><figcaption>3. Perro y gato en corazón</figcaption></figure>
  <figure><img src="4-speech-bubble-paw.svg" alt=""><div class="row"><img src="4-speech-bubble-paw.svg" alt=""><img class="small" src="4-speech-bubble-paw.svg" alt=""></div><figcaption>4. Burbuja con huella</figcaption></figure>
</div>
</body>
</html>
