  <g transform="translate(72 0)">
  <g font-family="'Nunito','Varela Round','Arial Rounded MT Bold','Segoe UI',sans-serif" font-weight="800" font-size="180" fill="#243329">
    <text x="568" y="270" text-anchor="end">petm</text>
