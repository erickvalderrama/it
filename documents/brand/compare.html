<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Petyei vs Petyey</title>
<style>
  body { margin: 0; padding: 24px; background: #F5F8EE; color: #243329; font-family: 'Segoe UI', sans-serif; }
  section { background: #fff; border-radius: 16px; padding: 16px 24px; margin-bottom: 24px; max-width: 1100px; }
  h2 { margin: 0 0 8px; font-size: 20px; }
  .row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .lockup { width: 540px; }
  .wm { width: 300px; border-radius: 12px; }
  .i96 { width: 96px; } .i48 { width: 48px; } .i24 { width: 24px; }
</style>
</head>
<body>
  <section>
    <h2>Petyei</h2>
    <div class="row">
      <img class="lockup" src="petyei/lockup.svg" alt="">
      <img class="wm" src="petyei/wordmark-dark.svg" alt="">
      <img class="i96" src="petyei/icon.svg" alt=""><img class="i96" src="petyei/icon-dark.svg" alt="">
      <img class="i48" src="petyei/icon.svg" alt=""><img class="i24" src="petyei/icon.svg" alt="">
    </div>
  </section>
  <section>
    <h2>Petyey</h2>
    <div class="row">
      <img class="lockup" src="petyey/lockup.svg" alt="">
      <img class="wm" src="petyey/wordmark-dark.svg" alt="">
      <img class="i96" src="petyey/icon.svg" alt=""><img class="i96" src="petyey/icon-dark.svg" alt="">
      <img class="i48" src="petyey/icon.svg" alt=""><img class="i24" src="petyey/icon.svg" alt="">
    </div>
  </section>
</body>
</html>
