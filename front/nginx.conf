server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Deep links: unknown paths fall back to the Flutter app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always fetch the latest app shell; hashed assets can be cached.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
